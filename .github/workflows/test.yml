name: Test

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (ingest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v tests

  render:
    name: Render dashboard (fake data)
    runs-on: ubuntu-latest
    env:
      QUARTO_VERSION: "1.12.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Render with full fake data
        env:
          OPENMS_DATA_DIR: ${{ runner.temp }}/fake
        run: |
          python scripts/make_fake_data.py
          cd dashboard && QUARTO_PYTHON=$(which python) quarto render index.qmd
          cd .. && python scripts/check_render.py dashboard/index.html --strict
          mkdir -p "$RUNNER_TEMP/site" && cp -r dashboard/index.html dashboard/index_files "$RUNNER_TEMP/site/"

      - name: Render with no data (first-run state)
        env:
          OPENMS_DATA_DIR: ${{ runner.temp }}/empty
        run: |
          mkdir -p "$OPENMS_DATA_DIR"
          cd dashboard && QUARTO_PYTHON=$(which python) quarto render index.qmd
          cd .. && python scripts/check_render.py dashboard/index.html

      - name: Upload rendered dashboard (fake data only)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: ${{ runner.temp }}/site
          retention-days: 7

  docker:
    name: Docker image (build + fake-data render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t openms-dashboard .
      - name: Render fake data inside the container (as a non-root user, like docker compose)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e OPENMS_DATA_DIR=/tmp/fake openms-dashboard bash -c '
            set -e
            python scripts/make_fake_data.py > /dev/null
            cd dashboard && QUARTO_PYTHON="$PYTHON" quarto render index.qmd
            cd .. && python scripts/check_render.py dashboard/index.html --strict'
      - name: docker-refresh.sh passes .env like bash does (quotes, inline comments, pinned paths)
        run: |
          cp .env.example .env
          printf 'GITHUB_COMMITS_SINCE=   # inline comment\nPYTHON=/somewhere/else/python\n' >> .env
          chmod 600 .env
          ./docker-refresh.sh bash -c '
            set -e
            test "$PYTHON" = /usr/local/bin/python && test "$DEPLOY_DIR" = /site && test "$OPENMS_DATA_DIR" = /app/data
            test -z "$GITHUB_TOKEN" && test -z "$GITHUB_COMMITS_SINCE"
            python -c "import os; from ingest.common import parse_mapping as p; m = p(os.environ[\"GITHUB_REPOS\"]); assert m[\"OpenMS/OpenMS\"] == [\"core\", \"python\"], m; print(m)"
            touch /app/data/write-test /site/write-test && id'
          test -O data/write-test && test -O site/write-test   # written as the host user
