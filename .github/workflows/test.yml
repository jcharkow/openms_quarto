name: Test

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (ingest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v tests

  render:
    name: Render dashboard (fake data)
    runs-on: ubuntu-latest
    env:
      QUARTO_VERSION: "1.12.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Render with full fake data
        env:
          OPENMS_DATA_DIR: ${{ runner.temp }}/fake
        run: |
          python scripts/make_fake_data.py
          cd dashboard && QUARTO_PYTHON=$(which python) quarto render index.qmd
          cd .. && python scripts/check_render.py dashboard/index.html --strict
          mkdir -p "$RUNNER_TEMP/site" && cp -r dashboard/index.html dashboard/index_files "$RUNNER_TEMP/site/"

      - name: Render with no data (first-run state)
        env:
          OPENMS_DATA_DIR: ${{ runner.temp }}/empty
        run: |
          mkdir -p "$OPENMS_DATA_DIR"
          cd dashboard && QUARTO_PYTHON=$(which python) quarto render index.qmd
          cd .. && python scripts/check_render.py dashboard/index.html

      - name: Upload rendered dashboard (fake data only)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: ${{ runner.temp }}/site
          retention-days: 7
